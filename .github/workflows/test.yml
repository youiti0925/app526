# push / PR のたびに型チェック・単体テスト（UTC と日本時間）・E2E を走らせる。
# AIキーや外部サイトへの接続は使わない（テストは全部ローカルで完結する）。
name: test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: 単体テスト（UTC と日本時間）
        run: npm run test:unit
      - name: E2E
        run: npm run test:e2e
